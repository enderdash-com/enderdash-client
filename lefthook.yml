lefthook: bunx --no-install lefthook
min_version: 2.2.2

pre-commit:
  commands:
    whitespace:
      run: git diff --cached --check
    format:
      run: bunx --no-install oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,mjs,cjs,ts,mts,cts}"
      run: bunx --no-install oxlint {staged_files}

pre-push:
  commands:
    types:
      glob: "*.{ts,json}"
      run: bun run check
    tests:
      glob: "*.{ts,json}"
      run: bun run test
